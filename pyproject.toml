[project]
name = "maniflow"
version = "0.1.0"
description = "Goal Reaching with Obstacle Avoidance via Flow-Matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=26.5.1",
    "h5py>=3.16.0",
    "lmdb>=2.2.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "mujoco>=3.9.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "ompl>=2.0.0",
    "py-trees>=2.4.0",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
    "rich>=15.0.0",
    "ruff>=0.15.17",
    "scipy>=1.15.3",
    "setuptools>=70.2.0",
    "shapely>=2.1.2",
    "simple-parsing>=0.1.8",
    "torch>=2.0.0",
    "torch-ema>=0.3",
    "torchvision>=0.20.1",
    "tqdm>=4.66.5",
    "typer>=0.26.7",
    "typing-extensions>=4.15.0",
    "tyro>=1.0.13",
    "zarr>=2.18.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maniflow"]

[tool.black]
target-version = ['py310']

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
